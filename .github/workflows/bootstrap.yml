      - name: Commit admin gateway update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No admin changes to commit.'
            exit 0
          fi
          git commit -m 'Replace CMS login with GitHub editing gateway'
          git push
